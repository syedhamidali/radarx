name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

# CI only reads the repository; Codecov and TestPyPI uploads use their own tokens.
permissions:
  contents: read

jobs:
  lint:
    name: lint and style checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "black==24.2.0" "black[jupyter]==24.2.0" "ruff"
      - name: Black style check
        run: |
          black --check .
      - name: Lint with ruff
        run: |
          ruff check .

  build_0:
    name: radarx unit tests - linux
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        shell: bash -l {0}
    env:
      CONDA_ENV_FILE: ci/unittests.yml
      PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        numpy-version: ["1", "2"]
        # NumPy 1 has no builds for Python >= 3.13
        exclude:
          - python-version: "3.13"
            numpy-version: "1"
          - python-version: "3.14"
            numpy-version: "1"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get date for the environment cache key
      id: date
      run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
    - name: Install micromamba environment
      uses: mamba-org/setup-micromamba@v2
      with:
          environment-name: radarx-unit-tests
          environment-file: ${{env.CONDA_ENV_FILE}}
          cache-environment: true
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-py${{env.PYTHON_VERSION}}-np${{matrix.numpy-version}}-${{steps.date.outputs.today}}-${{hashFiles(env.CONDA_ENV_FILE)}}"
          create-args: >-
              python=${{matrix.python-version}}
              numpy=${{matrix.numpy-version}}
              conda

    - name: Install coverage via pip   # ADD THIS STEP TO INSTALL COVERAGE
      run: |
        python -m pip install coverage pytest-cov pytest-xdist pytest-mock
    - name: Install radarx
      run: |
        python -m pip install . --no-deps
    - name: Version Info
      run: |
        python -c "import radarx; print(radarx.version.version)"
    - name: Check the compiled gridding kernel
      run: |
        python ci/check_compiled_kernel.py
    - name: Test with pytest
      run: |
        pytest -n auto --dist loadfile --verbose --durations=15 --cov-report xml:coverage_unit.xml --cov=radarx --pyargs tests
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage_unit.xml
        flags: unittests
        env_vars: RUNNER_OS,PYTHON_VERSION
        name: codecov-gha
        fail_ci_if_error: false
        token: ${{secrets.CODECOV_TOKEN}}

  build_os:
    name: radarx unit tests - ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    needs: [lint]
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_ENV_FILE: ci/unittests.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            os-name: macos
          - os: windows-latest
            os-name: windows
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get date for the environment cache key
      id: date
      run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
    - name: Install micromamba environment
      uses: mamba-org/setup-micromamba@v2
      with:
          environment-name: radarx-unit-tests
          environment-file: ${{env.CONDA_ENV_FILE}}
          cache-environment: true
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-py3.12-np2-${{steps.date.outputs.today}}-${{hashFiles(env.CONDA_ENV_FILE)}}"
          create-args: >-
              python=3.12
              numpy=2
    - name: Install pytest plugins via pip
      run: |
        python -m pip install pytest-xdist pytest-mock
    - name: Install radarx
      run: |
        python -m pip install . --no-deps
    - name: Version Info
      run: |
        python -c "import radarx; print(radarx.version.version)"
    - name: Check the compiled kernels
      run: |
        python ci/check_compiled_kernel.py
    - name: Test with pytest
      run: |
        pytest -n auto --dist loadfile --verbose --durations=15 --pyargs tests

  build_1:
    name: radarx notebook tests - linux
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        shell: bash -l {0}
    env:
      CONDA_ENV_FILE: ci/notebooktests.yml
      PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        numpy-version: ["2"]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get date for the environment cache key
      id: date
      run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
    - name: Install micromamba environment
      uses: mamba-org/setup-micromamba@v2
      with:
          environment-name: radarx-notebook-tests
          environment-file: ${{env.CONDA_ENV_FILE}}
          cache-environment: true
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-py${{env.PYTHON_VERSION}}-np${{matrix.numpy-version}}-${{steps.date.outputs.today}}-${{hashFiles(env.CONDA_ENV_FILE)}}"
          create-args: >-
              python=${{matrix.python-version}}
              numpy=${{matrix.numpy-version}}
              conda
    - name: Install coverage and pytest via pip
      run: |
        python -m pip install coverage pytest-cov pytest-xdist pytest-mock
    - name: Install radarx
      run: |
        python -m pip install . --no-deps
    - name: Version Info
      run: |
        python -c "import radarx; print(radarx.version.version)"
    - name: Test with pytest
      run: |
        pytest --verbose --durations=15 --cov=radarx --cov-report=xml:coverage_notebook.xml --cov-report=term-missing --cov-fail-under=0 docs/notebooks
    # unit tests for optional packages that the unit-test environment leaves
    # out (fast-barnes-py, uxarray, datashader); "python -m" puts the source
    # tree on sys.path, so coverage is measured on it as in the unit-test job
    - name: Test optional-dependency paths with pytest
      run: |
        python -m pytest --verbose --cov=radarx --cov-report=xml:coverage_optional.xml --cov-fail-under=0 tests/grid/test_grid.py tests/grid/test_ugrid.py tests/vis/test_interactive.py
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage_notebook.xml,./coverage_optional.xml
        flags: notebooktests
        env_vars: RUNNER_OS,PYTHON_VERSION
        name: codecov-gha
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN}}

  test_build_distribution_testpypi:
    name: test build distribution for testpypi
    needs: [lint, build_0]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel twine toml-cli
      - name: Package
        run: |
          toml set --toml-path pyproject.toml tool.setuptools_scm.local_scheme "no-local-version"
          git update-index --assume-unchanged pyproject.toml
          python -m build
          cp dist/radarx*.gz dist/radarx1.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radarx-1-${{github.event.number}}
          path: dist/radarx1.gz
      - name: Upload to TestPyPI
        if: ${{ github.event_name == 'push' }}
        # a preview upload only: TestPyPI outages must not fail main
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          rm -f dist/radarx1.gz
          # platform wheels are built by cibuildwheel on release; upload the sdist
          # a rerun or force push can rebuild a version already on TestPyPI
          twine upload --skip-existing --repository testpypi dist/*.tar.gz

  test_build_distribution_pypi:
    name: test build distribution
    needs: [lint, build_0, test_build_distribution_testpypi]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel
      - name: Package
        run: |
          python -m build
          cp dist/radarx*.gz dist/radarx0.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radarx-0-${{github.event.number}}
          path: dist/radarx0.gz
