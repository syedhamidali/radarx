name: Test the installed radarx
description: >-
  Build and install the wheel, then run the unit tests from a copy of the repository
  without the radarx source, so that only the installed package can be imported. pytest
  imports radarx from the checkout when it runs there, and the checkout has no compiled
  kernels: their tests skip themselves and nothing fails.
inputs:
  coverage:
    description: Measure the coverage and write coverage_unit.xml, with the files mapped back to the checkout (.coveragerc)
    default: "false"
runs:
  using: composite
  steps:
  - name: Install radarx
    shell: bash -el {0}
    run: |
      python -m pip install . --no-deps
      python -c "import radarx, numpy, xarray; print(radarx.version.version, numpy.__version__, xarray.__version__)"
  - name: Fetch the test data
    shell: bash -el {0}
    run: |
      python ci/fetch_test_data.py
  - name: Check the compiled kernels of the installed package
    shell: bash -el {0}
    run: |
      python ci/check_compiled_kernel.py
      python ci/check_compiled_kernel.py --list > "$RUNNER_TEMP/kernels.txt"
  - name: Run the tests against the installed package
    shell: bash -el {0}
    env:
      RADARX_REQUIRE_KERNELS: ${{ runner.temp }}/kernels.txt
      COVERAGE_FILE: ${{ github.workspace }}/.coverage_installed
    run: |
      # everything the tests read from the repository, except the radarx source
      suite="$RUNNER_TEMP/suite"
      mkdir "$suite"
      git archive HEAD tests docs ml ci CITATION.cff pytest.ini | tar -x -C "$suite"
      cd "$suite"
      python -c "import radarx; print(radarx.__file__)"
      options=""
      if [ "${{ inputs.coverage }}" = "true" ]; then
        options="--cov=radarx --cov-config=$GITHUB_WORKSPACE/.coveragerc --cov-fail-under=0 --cov-report="
      fi
      pytest -n auto --dist loadfile --verbose --durations=15 $options
  - name: Map the coverage of the installed files back to the checkout
    if: inputs.coverage == 'true'
    shell: bash -el {0}
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
    run: |
      coverage combine "$GITHUB_WORKSPACE/.coverage_installed"
      coverage xml -o coverage_unit.xml
