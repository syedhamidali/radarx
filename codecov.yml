# Codecov waits for all coverage uploads of a CI run before it reports:
# 4 unit-test jobs (Python 3.12 with NumPy 1 and 2, 3.13 and 3.14 with NumPy 2) + 2
# notebook-test jobs. Update when the CI matrix changes.
codecov:
  notify:
    after_n_builds: 6

comment:
  after_n_builds: 6

coverage:
  status:
    project:
      default:
        # tolerate rounding noise between runs
        threshold: 0.1%
    patch:
      default:
        # a fixed target: with "auto" (the coverage of the base commit, 98.7 %) one missed
        # line in a patch of 27 lines failed the check of a merge. A patch must cover
        # nine lines in ten; the project check above guards the total.
        target: 90%
