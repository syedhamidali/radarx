name: radarx-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.11
  - pydata-sphinx-theme
  - myst-nb
  - jupytext
  - sphinx
  - sphinx-copybutton
  - sphinx-favicon
  - ipykernel
  - h5netcdf
  - h5py
  - lat_lon_parser
  - netCDF4
  - open-radar-data>=0.1.0
  - proj
  - proj-data
  - pyproj
  - xarray>=2024.10.0
  - xmltodict
  - cartopy
  - cmweather
  - dask
  - matplotlib-base
  - scipy
  - boto3
  - arm_pyart
  - ffmpeg
  - zarr
  - pooch
  - xradar
  - fsspec
  - wradlib
  - arm_pyart
  - hvplot
  - bokeh
  - holoviews
  - panel
  - datashader
  - uxarray
  - spatialpandas
  - geopandas
  - geoviews
  - nbclassic
  - itables
  - pip
  - pip:
    # optional, for grid_radar(method="barnes"); supports Python < 3.13 only
    - fast-barnes-py @ git+https://github.com/MeteoSwiss/fast-barnes-py.git ; python_version < "3.13"
    # IMD backend is only on xradar main until the next release
    - git+https://github.com/openradar/xradar.git@main
