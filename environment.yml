name: radarx-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.12
  - pydata-sphinx-theme
  - myst-nb
  - jupytext
  - sphinx
  - sphinx-copybutton
  - sphinx-favicon
  - ipykernel
  - h5netcdf
  - h5py
  - netCDF4
  - open-radar-data>=0.9.0
  - proj
  - proj-data
  - pyproj
  - xarray>=2024.10.0
  - cartopy
  - cmweather
  - dask
  - matplotlib-base
  - scipy
  - boto3
  - metpy
  - cfgrib
  - arm_pyart
  - ffmpeg
  - zarr
  - aiohttp
  - cdsapi
  - pooch
  # radarx[ml]: ONNX Runtime; onnx builds the example model of the notebook
  - onnx
  - onnxruntime
  - xradar>=0.13
  - fsspec
  - wradlib
  - arm_pyart
  - hvplot
  - bokeh
  - holoviews
  - panel
  - datashader
  - uxarray
  - spatialpandas
  - geopandas
  - geoviews
  - nbclassic
  - itables
  - pyyaml
  - pip
  - pip:
    # optional, for grid_radar(method="barnes"); supports Python < 3.13 only
    - fast-barnes-py @ git+https://github.com/MeteoSwiss/fast-barnes-py.git ; python_version < "3.13"
