name: radarx-unittests
channels:
  - conda-forge
dependencies:
  # radarx runtime dependencies (requirements.txt)
  - python>=3.12
  - boto3
  - cartopy
  - cmweather
  - lat_lon_parser
  - matplotlib-base
  - netCDF4
  - numpy
  - pooch
  - pyproj
  - scipy
  - xarray>=2024.10.0
  - xmltodict
  - xradar>=0.13
  # optional radarx[plot] extra (pure Python); datashader, uxarray and the
  # notebook-only packages are tested in the notebook job (ci/notebooktests.yml)
  - bokeh
  - holoviews>=1.20
  - hvplot>=0.11
  - panel
  # optional radarx[ml] extra (ONNX Runtime, about 17 MB); onnx builds the
  # tiny test models
  - onnx
  - onnxruntime
  # reads the Keras file of the TorNet weights (converted to ONNX on first use)
  - h5py
  # testing; dask is installed by the dask job of the workflow, so that the
  # other jobs run without it
  - zarr
  - coverage
  - open-radar-data>=0.3.0
  - pytest
  - pytest-cov
  - pytest-mock
  - pytest-xdist
  - setuptools
