name: radarx-notebookstests
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - cartopy
  - cmweather
  - codecov
  - coverage
  - dask
  - h5netcdf
  - h5py
  - lat_lon_parser
  - matplotlib-base
  - nbconvert
  - netCDF4
  - notebook
  - numpy
  - open-radar-data>=0.3.0
  - pyproj
  - pytest
  - pytest-cov
  - pytest-doctestplus
  - pytest-sugar
  - pytest-xdist
  - scipy
  - setuptools
  - xarray>=2024.10.0
  - xmltodict
  - xradar
  - hvplot>=0.11
  - holoviews>=1.20
  - bokeh
  - panel
  - datashader
  - uxarray
  - spatialpandas
  - geopandas
  - wradlib
  - boto3
  - arm_pyart
  - ffmpeg
  - zarr
  - aiohttp
  - fsspec
  - cdsapi
  - jupytext
  - nbclient
  - nbformat
  - pooch
  - itables
  # radarx[ml]: ONNX Runtime; onnx builds the example model of the notebook
  - onnx
  - onnxruntime
  - pip
  - pip:
    # for the Barnes test in tests/grid/test_grid.py; supports Python < 3.13 only
    - fast-barnes-py @ git+https://github.com/MeteoSwiss/fast-barnes-py.git ; python_version < "3.13"
    # IMD backend is only on xradar main until the next release
    - git+https://github.com/openradar/xradar.git@main
