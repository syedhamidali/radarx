version: 2
conda:
  environment: environment.yml
build:
  os: "ubuntu-24.04"
  tools:
    python: "miniforge3-latest"
sphinx:
  configuration: docs/conf.py
# notebooks run in a separate kernel, so radarx must be installed (not just
# on sys.path) for them to import it
python:
  install:
    - method: pip
      path: .
