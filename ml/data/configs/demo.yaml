# Demo build: 20 NEXRAD volumes in three events, one per split; runs in a few
# minutes on a laptop:
#
#   python ml/data/build_dataset.py ml/data/configs/demo.yaml -o demo_out
#
# Freezing levels are from the nearest 12/00 UTC radiosondes (IEM archive,
# radarx.io.sounding.read_sounding + isotherm_height); a negative value puts
# the surface below 0 degC (6.5 K/km lapse rate).
name: radarx-nexrad-demo
seed: 20260330
max_elevation: 2.5            # degrees; sweeps above are not read

polar:
  n_azimuth: 360              # 1-degree bins (nearest native ray)
  first_gate: 2125.0          # m
  gate_spacing: 250.0         # m
  n_gates: 920                # to 231.9 km

tasks:
  qc: {}
  kdp: {}
  hid: {}
  dealias:
    nyquist: [8.0, 20.0]      # artificial Nyquist velocity range, m/s
    sources: [observed_unaliased, radarx_dealiased]
    max_jump_fraction: 5.0e-4
  inpaint:
    n_sectors: [1, 3]
    width: [2.0, 20.0]        # degrees
    start_range: [2000.0, 60000.0]
    partial_probability: 0.5
    partial_fraction: [0.3, 0.9]
  nowcast:
    grid: {size: 256, spacing: 1000.0, z: [1000, 2000, 3000, 4000, 5000, 6000]}
    n_input: 2
    n_target: 1
    max_gap_minutes: 12
  multidoppler:
    max_elevation: 20.0       # the wind retrieval needs the whole volume
    grid:
      x: [-120000, 60000, 2000]   # m east of the first radar
      y: [-120000, 100000, 2000]
      z: [500, 12000, 500]
    pairs:
      - radars: [KGWX, KBMX]
        time: "2022-03-31T00:00:00"
        tolerance_minutes: 6

splits:
  fractions: {train: 0.7, val: 0.15, test: 0.15}
  holdout_radars: [KOKX]      # never seen in training
  min_gap_hours: 24

cases:
  - name: kgwx-qlcs-2022-03-30
    radar: KGWX
    start: "2022-03-30T23:00:00"
    end: "2022-03-31T00:00:00"
    event: qlcs-2022-03-30
    regime: squall line
    season: spring
    freezing_level: 3600
    split: train
  - name: kbmx-qlcs-2022-03-30
    radar: KBMX
    start: "2022-03-30T23:55:00"
    end: "2022-03-31T00:00:00"
    event: qlcs-2022-03-30      # same storms as KGWX: same split
    regime: squall line
    season: spring
    freezing_level: 3400
  - name: khgx-harvey-2017-08-27
    radar: KHGX
    start: "2017-08-27T12:00:00"
    end: "2017-08-27T12:30:00"
    regime: tropical cyclone rain
    season: summer
    freezing_level: 4800
    split: val
  - name: kokx-blizzard-2022-01-29
    radar: KOKX
    start: "2022-01-29T12:00:00"
    end: "2022-01-29T12:30:00"
    regime: winter storm (snow)
    season: winter
    freezing_level: -600
