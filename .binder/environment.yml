name: radarx-examples
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - matplotlib
  - numpy
  - pandas
  - pooch
  - setuptools
  - radarx
  - xarray
  - xradar
  - arm_pyart
  - wradlib
  - fsspec
  - cmweather
  - itables
  - jupytext
  - hvplot
  - holoviews
  - bokeh
  - panel
  - datashader
  - uxarray
  - spatialpandas
  - geopandas
  - open-radar-data
  - pip
  - pip:
    # optional, for grid_radar(method="barnes"); supports Python < 3.13 only
    - fast-barnes-py @ git+https://github.com/MeteoSwiss/fast-barnes-py.git ; python_version < "3.13"
